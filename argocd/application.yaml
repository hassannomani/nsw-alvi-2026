apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nsw-assignment-alvi
spec:
  destination:
    namespace: nsw-alvi-2026
    server: https://kubernetes.default.svc
  source:
    path: charts/nsw-single-window
    repoURL: https://github.com/hassannomani/nsw-alvi-2026
    targetRevision: HEAD
    helm:
      valueFiles:
        - values-dev.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
